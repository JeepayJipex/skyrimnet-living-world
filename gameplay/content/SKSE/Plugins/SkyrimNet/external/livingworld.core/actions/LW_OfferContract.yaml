scriptName: LW_ContractController
executionFunctionName: RequestOffer
parameterMapping:
  - type: speaker
eligibilityRules:
  - conditions:
      - decoratorName: lw_can_offer_contract
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: eligible
    logicalOperator: AND
    required: true
tags: []
enabled: true
defaultPriority: 3
